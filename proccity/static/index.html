<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>proccity</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #070a12; color: #cfd6e6; font: 13px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  #hud { position: fixed; left: 12px; top: 10px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #hud b { color: #fff; }
  #tip { position: fixed; display: none; padding: 6px 8px; background: rgba(10,14,24,.92); border: 1px solid #2a3350; border-radius: 4px; pointer-events: none; white-space: pre; }
  #legend { position: fixed; right: 12px; bottom: 10px; text-align: right; opacity: .75; }
  a { color: #8fb3ff; }
</style>
</head>
<body>
<div id="hud" role="status" aria-live="polite">proccity · connecting…</div>
<div id="tip" role="tooltip"></div>
<div id="legend">height = memory (log) · footprint = threads · glow = CPU<br>drag to orbit · wheel to zoom · hover a building</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const hud = document.getElementById('hud');
const tip = document.getElementById('tip');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a12);
scene.fog = new THREE.FogExp2(0x070a12, 0.010);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 600);
camera.position.set(38, 34, 38);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2.05;

scene.add(new THREE.HemisphereLight(0x8090c0, 0x101018, 0.9));
const sun = new THREE.DirectionalLight(0xfff0dd, 0.6); sun.position.set(30, 50, 20); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshStandardMaterial({ color: 0x0b0f1c, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; scene.add(ground);
scene.add(new THREE.GridHelper(400, 250, 0x1b2340, 0x121a30));

// one colour per user, stable across reloads
const userHue = new Map();
function colorFor(user) {
  if (!userHue.has(user)) { let h = 0; for (const c of user) h = (h * 31 + c.charCodeAt(0)) >>> 0; userHue.set(user, (h % 360) / 360); }
  return new THREE.Color().setHSL(userHue.get(user), 0.45, 0.42);
}

const box = new THREE.BoxGeometry(1, 1, 1); box.translate(0, 0.5, 0);   // grows from the ground
const buildings = new Map();   // pid -> { mesh, target:{w,h}, data, dying }
let centered = false;

function upsert(b) {
  let e = buildings.get(b.pid);
  if (!e) {
    const mat = new THREE.MeshStandardMaterial({ color: colorFor(b.user), roughness: .6, metalness: .1, emissive: 0x000000 });
    const mesh = new THREE.Mesh(box, mat);
    mesh.position.set(b.x, 0, b.z); mesh.scale.set(b.width, 0.01, b.width);
    scene.add(mesh);
    e = { mesh, target: { w: b.width, h: b.height }, data: b, dying: false };
    buildings.set(b.pid, e);
  }
  e.target = { w: b.width, h: b.height }; e.data = b; e.dying = false;
  // windows glow with CPU: 0% dark, 100% of one core fully lit
  const glow = Math.min(1, b.cpu / 100);
  e.mesh.material.emissive.setHSL(0.10, 0.9, 0.05 + 0.45 * glow);
}

async function poll() {
  try {
    const r = await fetch('/api/snapshot', { cache: 'no-store' });
    const snap = await r.json();
    const alive = new Set();
    for (const b of snap.buildings) { upsert(b); alive.add(b.pid); }
    for (const [pid, e] of buildings) if (!alive.has(pid)) e.dying = true;
    if (!centered && snap.buildings.length) {
      const cx = snap.buildings.reduce((a, b) => a + b.x, 0) / snap.buildings.length;
      const cz = snap.buildings.reduce((a, b) => a + b.z, 0) / snap.buildings.length;
      controls.target.set(cx, 0, cz); camera.position.set(cx + 38, 34, cz + 38); centered = true;
    }
    const totalRss = snap.buildings.reduce((a, b) => a + b.rss, 0);
    hud.innerHTML = `proccity · <b>${snap.buildings.length}</b> processes · <b>${(totalRss / 2 ** 30).toFixed(1)} GiB</b> resident · ${snap.cores} cores`;
  } catch (err) { hud.textContent = 'proccity · server unreachable'; }
}
setInterval(poll, 2000); poll();

// hover
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2(); let hovered = null;
addEventListener('pointermove', ev => {
  mouse.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  tip.style.left = ev.clientX + 14 + 'px'; tip.style.top = ev.clientY + 14 + 'px';
});

const clock = new THREE.Clock();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.1);
  const k = 1 - Math.exp(-dt * 4);   // smooth approach
  for (const [pid, e] of buildings) {
    const s = e.mesh.scale;
    if (e.dying) {
      s.y += (0 - s.y) * k * 2;
      if (s.y < 0.02) { scene.remove(e.mesh); e.mesh.material.dispose(); buildings.delete(pid); }
      continue;
    }
    s.y += (e.target.h - s.y) * k; s.x += (e.target.w - s.x) * k; s.z += (e.target.w - s.z) * k;
  }
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects([...buildings.values()].map(e => e.mesh), false)[0];
  if (hit) {
    const e = [...buildings.values()].find(e => e.mesh === hit.object);
    if (e && e !== hovered) { hovered = e; }
    const d = e.data;
    tip.textContent = `${d.name}  (pid ${d.pid})\nuser    ${d.user}\ncpu     ${d.cpu.toFixed(1)}%\nrss     ${(d.rss / 2 ** 20).toFixed(0)} MiB\nthreads ${d.threads}\nstatus  ${d.status}`;
    tip.style.display = 'block';
  } else { hovered = null; tip.style.display = 'none'; }
  controls.update(); renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
